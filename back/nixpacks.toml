[phases.setup]
  nixPkgs = ["php", "composer"]

[phases.install]
  cmds = [
    "composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader"
  ]

# Avoid running artisan cache commands at build time since env may not be present yet

[start]
  cmd = "php -S 0.0.0.0:$PORT -t public public/index.php"


